spring.application.name=secop

# Public read-only SECOP II SODA API (dataset p6dx-8zbt). No secrets required.
secop.datos-gov-base-url=https://www.datos.gov.co/resource/p6dx-8zbt.json
# Public attachment index (dataset dmgg-8hin). Document binaries are fetched via RetrieveFile.
secop.archivos-gov-base-url=https://www.datos.gov.co/resource/dmgg-8hin.json
secop.parametria-path=classpath:parametria/parametria-ofertas.json
secop.default-min-match=80
secop.fetch-limit=200
secop.default-limit=20
# Writable folder for Estudio Previo PDFs. Default matches the resources layout for local
# spring-boot:run. A packaged JAR cannot write into the classpath — set an absolute path in prod.
secop.estudios-previos-dir=src/main/resources/estudios-previos
# Search intent: Caqueta from parametria plus national entities of interest.
# ASCII stems only — scoring folds accents, so Policia still matches POLICÍA.
secop.national-entities=Policia,Ejercito,ICBF,Armada,Fuerza Aeroespacial,Fuerza Aerea,Ministerio de Defensa,INPEC,SENA
